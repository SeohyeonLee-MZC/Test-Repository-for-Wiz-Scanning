name: Wiz CLI IaC Scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  wiz-iac-scan:
    name: Wiz IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Wiz CLI 다운로드 및 실행 권한 부여
      - name: Download Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      # 3. Wiz CLI 인증
      - name: Authenticate to Wiz
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

      # 4. IaC 스캔 실행 (정책 위반 시 빌드 실패)
      - name: Run Wiz IaC Scan
        run: |
          ./wizcli iac scan \
            --path . \
            --policy "Default IaC policy" \
            --format sarif \
            --output wiz-iac-results.sarif
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

      # 5. (선택) SARIF 결과를 GitHub Security 탭에 업로드
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: wiz-iac-results.sarif
